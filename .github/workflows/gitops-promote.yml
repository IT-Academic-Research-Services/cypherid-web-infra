name: gitops-promote

# Env promotion for the Argo CD blue/green delivery (#444): copy the image.tag that
# passed a lower env forward to the next one (dev -> staging -> prod), opening a PR.
# This replaces the old ECS deploy-promote chain.
#
# The promotion GATE is enforced in-cluster, not here: staging has
# autoPromotionEnabled: true (Rollouts promotes on smoke pass), prod has false (the
# Rollout PAUSES after smoke for a manual `kubectl argo rollouts promote`). Direct
# dev -> prod is rejected (mirrors the apply_all no-direct-to-prod rule).

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Env whose current tag to promote FROM'
        type: choice
        options: [dev, staging]
        required: true
      target:
        description: 'Env to promote TO'
        type: choice
        options: [staging, prod]
        required: true

concurrency:
  group: gitops-promote-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    # dev->staging waits for a required reviewer on the `promote-staging` GitHub Environment -- the
    # human "this is the image we want" approval. staging->prod uses `promote-prod`. Configure the
    # required reviewers per environment in repo settings. A future AUTO_PROMOTE auto-trigger would
    # skip only this manual selection; the gauntlet attestation gate below ALWAYS runs.
    environment: promote-${{ github.event.inputs.target }}
    permissions:
      contents: read
      id-token: write # keyless cosign verify-attestation
    steps:
      # IT-ARS authenticates gitops writes with a GitHub App (repo var CI_APP_ENABLED=true);
      # the thorvath-slower fork has no app, so this step is skipped and the tokens below fall
      # back to the GITOPS_TOKEN PAT. See platform-overhaul #683.
      - name: Generate app token
        id: app_token
        if: ${{ vars.CI_APP_ENABLED == 'true' }}
        uses: chanzuckerberg/github-app-token@365b1f2db827eb8f17288ec335b1a7e3c03ff683 # v1.1.4
        with:
          app_id: ${{ secrets.GH_ACTIONS_HELPER_APP_ID }}
          private_key: ${{ secrets.GH_ACTIONS_HELPER_PK }}
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app_token.outputs.token || secrets.GITOPS_TOKEN }}

      - name: Validate the promotion path
        env:
          SRC: ${{ github.event.inputs.source }}
          DST: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          # ':' separator (not '->'): shellcheck can't parse '>' inside a case pattern.
          case "${SRC}:${DST}" in
            dev:staging|staging:prod) echo "promotion ${SRC} -> ${DST} allowed" ;;
            *) echo "::error::illegal promotion ${SRC} -> ${DST} (only dev->staging, staging->prod)"; exit 1 ;;
          esac

      - name: Install yq
        run: |
          YQ=v4.44.3
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ}/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      # env-staging only accepts images the staging gauntlet has attested (SMP staging-gauntlet).
      # Before copying dev's tag onto staging, require a `gauntlet-passed` cosign attestation on the
      # DEV image digest (produced by seqtoid-web/staging-gauntlet.yml). No attestation -> refuse.
      # The env-staging sigstore admission ClusterImagePolicy is the in-cluster backstop (separate PR).
      # Skipped for staging->prod (prod gets its own gate/gauntlet).
      - name: Configure AWS for attestation verify (dev ECR read)
        if: ${{ github.event.inputs.target == 'staging' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::491013321714:role/${{ vars.GAUNTLET_VERIFY_ROLE }}
          aws-region: us-west-2
      - name: Install cosign
        if: ${{ github.event.inputs.target == 'staging' }}
        uses: sigstore/cosign-installer@v3
      - name: Require gauntlet-passed attestation (dev -> staging)
        if: ${{ github.event.inputs.target == 'staging' }}
        env:
          SRC: ${{ github.event.inputs.source }}
          # Override via repo var if the workflow path/org differs.
          GAUNTLET_ID_REGEXP: ${{ vars.GAUNTLET_WORKFLOW_REGEXP || '^https://github\.com/IT-Academic-Research-Services/seqtoid-web/\.github/workflows/staging-gauntlet\.yml@refs/.*$' }}
        run: |
          set -euo pipefail
          REPO=491013321714.dkr.ecr.us-west-2.amazonaws.com/seqtoid-web
          TAG="$(yq '.image.tag' "deploy/argocd/values/seqtoid-web/${SRC}.yaml")"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then echo "::error::source ${SRC} has no tag to verify"; exit 1; fi
          aws ecr get-login-password --region us-west-2 | cosign login "$REPO" -u AWS --password-stdin
          DIGEST="$(aws ecr describe-images --repository-name seqtoid-web --region us-west-2 \
            --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)"
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then echo "::error::no ECR digest for tag ${TAG}"; exit 1; fi
          echo "verifying gauntlet-passed attestation on ${REPO}@${DIGEST} ..."
          cosign verify-attestation --type custom \
            --certificate-identity-regexp "$GAUNTLET_ID_REGEXP" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REPO}@${DIGEST}" >/dev/null \
            || { echo "::error::${TAG} has no valid gauntlet-passed attestation -- run the staging gauntlet on it first"; exit 1; }
          echo "gauntlet attestation verified -- ${TAG} is cleared to promote to env-staging"

      # Deliver the VETTED artifact to the staging registry. The build pushes dev-account only and
      # there is no ECR replication, so `cosign copy` is the official image-delivery path into
      # 030998640247/seqtoid-web -- it moves the image AND its gauntlet-passed attestation together
      # (same digest, provenance intact), which is exactly what the env-staging admission policy then
      # verifies. Cross-account: dev creds (previous step) log into the source; a staging-account
      # ECR-write role (assumed by chaining) logs into the destination. Both stay in the cosign
      # keychain so `cosign copy` can read dev + write staging in one shot.
      - name: Assume staging ECR-write role (destination)
        if: ${{ github.event.inputs.target == 'staging' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::030998640247:role/${{ vars.STAGING_ECR_WRITE_ROLE }}
          role-chaining: true
          aws-region: us-west-2
      - name: Copy vetted image + attestation dev -> staging registry
        if: ${{ github.event.inputs.target == 'staging' }}
        env:
          SRC: ${{ github.event.inputs.source }}
        run: |
          set -euo pipefail
          DEV_REPO=491013321714.dkr.ecr.us-west-2.amazonaws.com/seqtoid-web
          STG_REPO=030998640247.dkr.ecr.us-west-2.amazonaws.com/seqtoid-web
          TAG="$(yq '.image.tag' "deploy/argocd/values/seqtoid-web/${SRC}.yaml")"
          # Log into the STAGING registry (creds are now the staging role). The DEV registry is
          # already in the cosign keychain from the verify step's `cosign login`.
          aws ecr get-login-password --region us-west-2 | cosign login "$STG_REPO" -u AWS --password-stdin
          echo "copying ${DEV_REPO}:${TAG} -> ${STG_REPO}:${TAG} (image + signatures + attestations)"
          cosign copy "${DEV_REPO}:${TAG}" "${STG_REPO}:${TAG}"
          echo "vetted image + gauntlet attestation now present in the staging registry"

      - name: Copy the source tag onto the target
        id: promote
        env:
          SRC: ${{ github.event.inputs.source }}
          DST: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          SRC_FILE="deploy/argocd/values/seqtoid-web/${SRC}.yaml"
          DST_FILE="deploy/argocd/values/seqtoid-web/${DST}.yaml"
          TAG="$(yq '.image.tag' "$SRC_FILE")"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ] || [ "$TAG" = "latest" ]; then
            echo "::error::source ${SRC} has no immutable tag to promote (got '$TAG')"; exit 1
          fi
          CURRENT="$(yq '.image.tag' "$DST_FILE")"
          echo "promoting ${SRC}(${TAG}) -> ${DST}(was ${CURRENT})"
          if [ "$CURRENT" = "$TAG" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "${DST} already at ${TAG} — nothing to promote."; exit 0
          fi
          yq -i ".image.tag = \"$TAG\"" "$DST_FILE"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"      >> "$GITHUB_OUTPUT"

      - name: Open the promotion PR
        if: steps.promote.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITOPS_TOKEN }}
          SRC: ${{ github.event.inputs.source }}
          DST: ${{ github.event.inputs.target }}
          TAG: ${{ steps.promote.outputs.tag }}
        run: |
          set -euo pipefail
          BRANCH="gitops/promote-${DST}-${TAG}"
          git config user.name  "seqtoid-gitops"
          git config user.email "gitops@seqtoid.local"
          git checkout -b "$BRANCH"
          git add "deploy/argocd/values/seqtoid-web/${DST}.yaml"
          git commit -m "gitops(${DST}): promote seqtoid-web image.tag -> ${TAG} (from ${SRC})"
          git push -u origin "$BRANCH" --force-with-lease
          GATE="staging auto-promotes on smoke pass"
          if [ "$DST" = "prod" ]; then GATE="prod PAUSES after smoke — run \`kubectl argo rollouts promote\` to release"; fi
          gh pr create \
            --title "gitops(${DST}): promote seqtoid-web -> ${TAG}" \
            --body "Promote ${TAG} from ${SRC} to ${DST}. After merge, Argo CD syncs; ${GATE}." \
            --base main --head "$BRANCH" || echo "PR may already exist for $BRANCH"
