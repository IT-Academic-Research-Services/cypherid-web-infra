# Karpenter NodePools for env-staging (SMP-1636 #958) -- mirror dev's dedicated pools so staging gets
# real node parity: a `web` pool for the app tier + a tainted, always-warm `bulk-download` pool for the
# s3-tar-writer Jobs (kept warm by the warmpool balloon in warmpool.yaml). Replaces the single static
# managed nodegroup + the temporary bridge nodegroup. API v1beta1 (Karpenter 0.37.x -- the version
# ssot-infra addons enable_karpenter installs). staging only.
#
# v1beta1 SCHEMA NOTES (differs from Karpenter 1.x / v1): `expireAfter` lives under `spec.disruption`
# (NOT spec.template.spec), and consolidationPolicy is `WhenEmpty` or `WhenUnderutilized` (there is no
# `WhenEmptyOrUnderutilized` -- that is a v1-only value). Mirrors the proven prod-preview nodepool.
---
# Web pool: small right-sized amd64 nodes (2-8 vCPU c/m/r) for web + workers (nodeSelector
# seqtoid.io/pool=web). spot+on-demand; WhenUnderutilized consolidation (continuous, like prod-preview).
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: seqtoid-web
spec:
  template:
    metadata:
      labels:
        seqtoid.io/pool: web
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: default
      requirements:
        - { key: kubernetes.io/arch, operator: In, values: ["amd64"] }
        - { key: kubernetes.io/os, operator: In, values: ["linux"] }
        - { key: karpenter.sh/capacity-type, operator: In, values: ["spot", "on-demand"] }
        - { key: karpenter.k8s.aws/instance-category, operator: In, values: ["c", "m", "r"] }
        - { key: karpenter.k8s.aws/instance-cpu, operator: Gt, values: ["3"] }
        - { key: karpenter.k8s.aws/instance-cpu, operator: Lt, values: ["9"] }
        - { key: karpenter.k8s.aws/instance-family, operator: NotIn, values: ["a1", "c1", "cc1", "cc2", "cg1", "cg2", "cr1", "g1", "g2", "hi1", "hs1", "m1", "m2", "m3", "t1"] }
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 360h
  limits:
    cpu: "64"
---
# Bulk-download pool: TAINTED (seqtoid.io/pool=bulk-download:NoSchedule) so ONLY the tar Jobs + the
# warmpool balloon land here; a big tar never fights the app for a node, and node reclaim = a failed
# download can't strand app pods. on-demand only (a spot reclaim mid-tar = a failed download). Up to
# 16-vCPU nodes; WhenEmpty + consolidateAfter 5m so a burst node lingers briefly then reclaims when empty.
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: seqtoid-bulk-download
spec:
  template:
    metadata:
      labels:
        seqtoid.io/pool: bulk-download
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: default
      taints:
        - { key: seqtoid.io/pool, value: bulk-download, effect: NoSchedule }
      requirements:
        - { key: kubernetes.io/arch, operator: In, values: ["amd64"] }
        - { key: kubernetes.io/os, operator: In, values: ["linux"] }
        - { key: karpenter.sh/capacity-type, operator: In, values: ["on-demand"] }
        - { key: karpenter.k8s.aws/instance-category, operator: In, values: ["c", "m", "r"] }
        - { key: karpenter.k8s.aws/instance-cpu, operator: Gt, values: ["1"] }
        - { key: karpenter.k8s.aws/instance-cpu, operator: Lt, values: ["17"] }
        - { key: karpenter.k8s.aws/instance-family, operator: NotIn, values: ["a1", "c1", "cc1", "cc2", "cg1", "cg2", "cr1", "g1", "g2", "hi1", "hs1", "m1", "m2", "m3", "t1"] }
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    expireAfter: 168h
  limits:
    cpu: "32"
    memory: 128Gi
