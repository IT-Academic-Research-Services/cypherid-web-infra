# Karpenter NodePool for prod-preview -- WHAT Karpenter provisions + WHEN it removes it.
# General-purpose: provisions right-sized nodes for any pod the managed system nodegroup (min 1, #42) can't
# fit -- i.e. burst above the 1-node floor -- and consolidates them back to ZERO when idle
# (consolidationPolicy: WhenUnderutilized). Spot-first with on-demand fallback keeps the rehearsal cheap.
# API v1beta1 (Karpenter 0.37.x). prod-preview only.
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        workload: app
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
  # Scale-to-zero: remove empty/underutilized nodes so idle prod-preview drops back to the managed system
  # floor. expireAfter rotates nodes (patching) every 30d.
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h
  # Cost ceiling for the whole NodePool (a rehearsal must never runaway-scale).
  limits:
    cpu: "100"
