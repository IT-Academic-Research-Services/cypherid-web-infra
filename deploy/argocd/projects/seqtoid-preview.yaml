# Scoped AppProject for per-PR preview sandboxes (#617/#619). DELIBERATELY tighter than
# the czid project: preview Applications may deploy ONLY into seqtoid-pr-* namespaces,
# may create NO cluster-scoped resources, and may only use the app chart + this repo's
# values. This is the Argo-side half of the fail-closed guarantee -- a preview app
# STRUCTURALLY cannot create/modify anything in seqtoid-dev, argocd, kube-system, or any
# other namespace, no matter what a PR's chart tries to render.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: seqtoid-preview
  namespace: argocd
spec:
  description: Per-PR preview sandboxes (isolated app + DB + S3; shared dev backend)
  sourceRepos:
    - https://github.com/thorvath-slower/seqtoid-web.git        # app chart (@ PR head sha)
    - https://github.com/IT-Academic-Research-Services/seqtoid-web.git  # transitional: IT-ARS (cutover #692); keep thorvath for rollback
    - https://github.com/thorvath-slower/cypherid-web-infra.git # preview base values
    - https://github.com/IT-Academic-Research-Services/cypherid-web-infra.git  # transitional: IT-ARS (cutover #692); keep thorvath for rollback
  # ONLY per-PR namespaces on the dev cluster. Glob -- pr-1, pr-2, ... all match; nothing
  # else (seqtoid-dev, czid-*, argocd, kube-system) is a valid destination.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: seqtoid-pr-*
  # The ONLY cluster-scoped resource a preview may create is its OWN namespace (via
  # syncOptions CreateNamespace=true). Combined with destinations = seqtoid-pr-* only, a
  # preview can create nothing but seqtoid-pr-<n> namespaces -- no other cluster object.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # Exactly the namespaced kinds the chart renders -- nothing else can be created even
  # inside a pr-* namespace.
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: networking.k8s.io
      kind: Ingress
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    # The chart's pdb.yaml renders whenever podDisruptionBudget.enabled is set, which it is in
    # preview. Without this entry Argo rejects the PodDisruptionBudget as "not permitted in project
    # seqtoid-preview", and because that invalidates the WHOLE sync the namespace is never created
    # and the sandbox never serves -- it just times out with no indication of the real cause. This
    # is what broke the preview sandbox for PR 182. Permitting it keeps previews faithful to what
    # dev actually runs, rather than disabling the PDB only in preview and letting them diverge.
    - group: policy
      kind: PodDisruptionBudget
    - group: argoproj.io
      kind: Rollout
    - group: argoproj.io
      kind: AnalysisTemplate
    - group: argoproj.io
      kind: AnalysisRun
    # The chart's bulk-download-rbac.yaml renders a Role + RoleBinding whenever
    # bulkDownload.rbac.create is set, which it is in preview (preview-base.yaml) so the preview web
    # SA can create the bulk-download tar Job in its own namespace (SMP-1496). Without these entries
    # Argo rejects them as "not permitted in project seqtoid-preview" and -- exactly like the
    # PodDisruptionBudget case above -- that invalidates the WHOLE sync, so the namespace never
    # comes up and the sandbox silently times out. Scoped to the namespace (namespaceResourceWhitelist),
    # never cluster-wide.
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
  # Reap everything in the namespace when a preview Application is deleted (PR close).
  orphanedResources:
    warn: false
