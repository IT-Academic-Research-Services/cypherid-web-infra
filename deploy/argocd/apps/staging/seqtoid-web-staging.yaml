# seqtoid-web @ staging (FRESH seqtoid pre-prod, account 030998640247, isolated from live czid-staging).
# New-scheme namespace seqtoid-staging (not the legacy czid- prefix); seqtoid AppProject; values in
# $values/.../staging.yaml. Tracks integration (chart + values), matching the integration-built image.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seqtoid-web-staging
  namespace: argocd
spec:
  project: seqtoid
  sources:
    - repoURL: https://github.com/IT-Academic-Research-Services/seqtoid-web.git
      targetRevision: integration
      path: deploy/charts/seqtoid-web
      helm:
        valueFiles:
          - $values/deploy/argocd/values/seqtoid-web/staging.yaml
    - repoURL: https://github.com/IT-Academic-Research-Services/cypherid-web-infra.git
      targetRevision: integration
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: seqtoid-staging
  syncPolicy:
    # pingpong readiness gates: the AWS LB Controller injects pod readiness gates into pods
    # in a namespace carrying this label, so the canary weight shift waits until the new pods'
    # ALB target is healthy (paired with rolloutStrategy: pingpong + --aws-verify-target-group
    # on the rollouts controller). Mirrors apps/dev/seqtoid-web-dev.yaml.
    managedNamespaceMetadata:
      labels:
        elbv2.k8s.aws/pod-readiness-gate-inject: enabled
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
