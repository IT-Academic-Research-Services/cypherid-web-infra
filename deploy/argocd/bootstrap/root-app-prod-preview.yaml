# =============================================================================
# App-of-apps root -- PROD-PREVIEW (locked-down pre-prod; prod account 283694049553).
#
# Mirrors bootstrap/root-app-sandbox.yaml. Manages ONLY the prod-preview app-layer Argo
# Applications under deploy/argocd/apps/prod-preview/. Runs from the argocd in the prod-preview
# cluster, so the in-cluster target kubernetes.default.svc is correct.
#
# This governs prod-preview only -- it NEVER touches customer-facing prod (seqtoid.org). Real prod,
# when it modernizes, gets its OWN root over apps/prod. prod-preview and prod are distinct
# name-prefixed workloads (seqtoid-prod-preview vs seqtoid-prod) in the same account.
#
# prod-preview is a FRESH build (the prod account is greenfield -- read-only survey 2026-07-25 found
# no app infra there), so like the other roots prune + selfHeal START DISABLED; flip to true only
# after the first sync is inspected.
#
# Applied by the env-reconstitute bootstrap stage:
#   prod-preview.appofapps_manifest = cypherid-web-infra/deploy/argocd/bootstrap/root-app-prod-preview.yaml
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seqtoid-root-prod-preview
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: seqtoid
  source:
    repoURL: https://github.com/IT-Academic-Research-Services/cypherid-web-infra.git
    targetRevision: main
    path: deploy/argocd/apps/prod-preview
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
