# =============================================================================
# App-of-apps root -- STAGING (fresh seqtoid pre-prod; account 030998640247, running
# alongside the LIVE legacy czid-staging). Mirrors bootstrap/root-app-sandbox.yaml.
#
# Manages ONLY the staging app-layer Argo Applications under deploy/argocd/apps/staging/.
# Runs from the argocd in the STAGING cluster (cluster-per-env), so the in-cluster target
# kubernetes.default.svc is correct. Deliberately does NOT manage infra addons (LBC,
# argo-rollouts, cert-manager, external-dns, ...): those are live Helm releases owned by the
# eks Terraform module (SSOT); a root over them would make Argo fight Terraform.
#
# prune + selfHeal START DISABLED (matching dev/sandbox) so the first sync is inspected
# before Argo is allowed to prune/self-heal. Flip both to true after the first sync looks right.
#
# Applied by the env-reconstitute bootstrap stage:
#   staging.appofapps_manifest = cypherid-web-infra/deploy/argocd/bootstrap/root-app-staging.yaml
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seqtoid-root-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: seqtoid
  source:
    repoURL: https://github.com/IT-Academic-Research-Services/cypherid-web-infra.git
    targetRevision: integration
    path: deploy/argocd/apps/staging
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
