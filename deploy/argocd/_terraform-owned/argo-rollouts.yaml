# Installs the Argo Rollouts controller (+ dashboard) cluster-wide. This is the
# engine that runs the blue/green strategy + AnalysisRuns the seqtoid-web chart
# declares. Chart version is pinned; bump deliberately.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
spec:
  project: czid
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.41.0
    helm:
      values: |
        controller:
          replicas: 2
          # Zero-downtime ping-pong cutovers (platform-overhaul 782): verify the new
          # color's ALB target group is healthy before scaling down the old color.
          # Needs the IRSA role below (elbv2 Describe*) for AWS API access.
          extraArgs:
            - --aws-verify-target-group
        # IRSA: the controller SA assumes the rollouts-controller role so
        # --aws-verify-target-group can call the read-only elbv2 Describe* APIs. Role
        # ARN is deterministic: <cluster>-argo-rollouts. Provisioned by terraform
        # module rollouts-controller-irsa (terraform/envs/dev/eks-v2). If the cluster
        # or account changes, update this ARN to match the terraform output.
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::491013321714:role/czid-dev-eks-v2-argo-rollouts
        dashboard:
          enabled: true
        installCRDs: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # the Rollouts CRDs are large; SSA avoids the annotation-size limit
