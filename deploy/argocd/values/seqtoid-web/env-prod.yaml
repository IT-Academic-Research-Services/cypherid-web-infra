# env-prod overrides for the seqtoid-web chart.
#
# env-prod = the REAL prod deployment, staged behind a hidden hostname
# (env-prod.seqtoid.org) with a deny-by-default WAF and the PROD Auth0 tenant,
# holding real P4 data + real internal testers. At go-live the DNS flips
# env-prod.seqtoid.org -> seqtoid.org. Also the Visual Compliance beta test bed.
# Account 283694049553. Cloned from staging.yaml; deltas called out inline.
environment: env-prod
# The main app (migrate/rollout/workers) reads CHAMBER_SERVICE from the image entrypoint, which defaults to
# idseq-<env>-web (the chart default / legacy path). The reconstitute chamber-seed-env-prod hook seeds the
# FRESH seqtoid chamber at /seqtoid-env-prod-web and the app IRSA role is granted SSM read on exactly
# /seqtoid-env-prod-web/*, so point the app there explicitly (mirrors staging).
secrets:
  chamber:
    service: seqtoid-env-prod-web
extraEnv:
  # The main app (migrate/rollout/workers) reads CHAMBER_SERVICE from the image entrypoint (defaults to
  # idseq-<env>-web); set it explicitly to the fresh seqtoid path the IRSA role is scoped to (mirrors staging).
  - name: CHAMBER_SERVICE
    value: seqtoid-env-prod-web
image:
  # env-prod ECR in the prod account (no czid-* path prefix). CI advances the tag
  # to the immutable git-sha on deploy.
  repository: 283694049553.dkr.ecr.us-west-2.amazonaws.com/seqtoid-web
  tag: sha-6449130f # env-prod config build (env-prod.rb + database.yml env-prod); pin, not floating latest
replicaCount: 2
serviceAccount:
  roleArn: arn:aws:iam::283694049553:role/seqtoid-web-env-prod
blueGreen:
  # env-prod: MANUAL promotion gate (real prod, real data) -- NOT staging's auto-promote.
  autoPromotionEnabled: false
  scaleDownDelaySeconds: 60
  analysis:
    enabled: true
    postPromotion: true
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 2Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
# Hidden edge for env-prod. ALB via the AWS Load Balancer Controller -> active service.
# The host answers ONLY for env-prod.seqtoid.org, so the listener never overlaps the
# maintenance-page CloudFront (the apex A-ALIAS is a different, untouched record).
ingress:
  enabled: true
  host: env-prod.seqtoid.org
  certificateArn: arn:aws:acm:us-west-2:283694049553:certificate/c04e8a77-a454-482d-b913-59fba7ac0401
  annotations:
    alb.ingress.kubernetes.io/subnets: subnet-0a0089da0e97ff68e,subnet-06782a1447900190c,subnet-0d359bd33b237007c
    # CRITICAL (plan s1.4 / s7 HIGH): the deny-by-default Web ACL is PINNED in the
    # ingress annotation so every ALB rebuild re-attaches it. Without this the ALB
    # can come up publicly reachable (observed on sandbox). Empty allowlist =
    # fail-closed. env-prod must NEVER be reachable without this gate.
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:us-west-2:283694049553:regional/webacl/seqtoid-env-prod-web/176e0ab9-3a2a-4ba8-8f1f-1e9487881cc5
