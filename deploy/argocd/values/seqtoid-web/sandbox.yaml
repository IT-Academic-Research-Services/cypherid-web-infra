# sandbox overrides for the seqtoid-web chart. Isolated rehearsal env, account 941377154785.
# Mirrors staging.yaml. Edge is wired: IRSA role seqtoid-web-sandbox (app terraform stack), the
# persistent sandbox.seqtoid.org ACM cert, subnets via LBC tag auto-discovery (no hardcoded IDs), host
# sandbox.seqtoid.org. OPEN ITEM: seqtoid.org is not hosted in this account (only .com/.net + the
# ucsf.czid.org zones), so the sandbox.seqtoid.org -> ALB record is NOT auto-created by this env's
# external-dns; point it at the fresh ALB (cross-account external-dns or a manual ALIAS) before smoke.
environment: sandbox
image:
  # A seqtoid-web repo must exist in sandbox ECR (pre-flight). Simple repo name, like dev.
  repository: 941377154785.dkr.ecr.us-west-2.amazonaws.com/seqtoid-web
  tag: latest            # CI advances this to the immutable git-sha tag on deploy
  # Rehearsal iteration: `latest` is repointed on each image rebuild, so pull it every time (otherwise a
  # node that cached an earlier `latest` reuses the stale image with IfNotPresent). A real deploy pins an
  # immutable sha tag and can drop this.
  pullPolicy: Always
replicaCount: 1          # rehearsal env: keep it lean (single_nat=true, minimal footprint)
migrate:
  # Fresh env: the brand-new Aurora has no idseq_<env> schema yet, so create it before migrating.
  # db:create is idempotent (skips when the DB already exists on re-runs). Default is migrate-only.
  command: ["rails", "db:create", "db:migrate:with_data"]
taxonLoad:
  # Deferred: the taxon-lineage import needs OpenSearch + the reference-data bucket, neither built in
  # this env yet (it reads s3://czid-public-references). Disable so the web pods deploy; the site does
  # not need taxon data (reports/heatmaps do). Re-enable once the data layer's OpenSearch lands.
  enabled: false
serviceAccount:
  # IRSA role naming is seqtoid-web-<env> (created by seqtoid-ssot-infra/infra/state-foundation/app),
  # NOT <env>-seqtoid-web.
  roleArn: arn:aws:iam::941377154785:role/seqtoid-web-sandbox
secrets:
  chamber:
    # FRESH seqtoid chamber path (not the chart default idseq-<env>-web, which is the DEAD legacy env's
    # config in this account). The reconstitute chamber-seed hook clones the legacy base config here and
    # repoints the infra keys; the app IRSA role is granted SSM read on exactly /seqtoid-sandbox-web/*.
    service: seqtoid-sandbox-web
# secrets.chamber.service only feeds the chart's PREVIEW jobs; the main app (migrate/rollout/workers)
# reads CHAMBER_SERVICE from the image entrypoint via commonEnv, which defaults to idseq-<env>-web. Set
# it explicitly so `chamber exec` reads the fresh seqtoid path the IRSA role is scoped to.
extraEnv:
  - name: CHAMBER_SERVICE
    value: seqtoid-sandbox-web
blueGreen:
  autoPromotionEnabled: true     # rehearsal env: promote on smoke pass (the gate is proven on dev)
  scaleDownDelaySeconds: 60
  analysis:
    enabled: true
    postPromotion: true
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 2Gi
autoscaling:
  enabled: false         # rehearsal env: no need to autoscale
  minReplicas: 1
  maxReplicas: 2
# Public edge for sandbox. ALB via the AWS Load Balancer Controller -> active service.
# smoke_url is set to match in env-reconstitute/config/envs.conf.
ingress:
  enabled: true
  host: sandbox.seqtoid.org
  # Persistent ACM cert for sandbox.seqtoid.org (ISSUED, DNS-validated). It lives OUTSIDE reconstitute
  # -- an account-level edge resource, not part of the destroy/rebuild -- so its ARN is stable across
  # rebuilds and safe to pin here. (Renew before NotAfter 2026-10-03.)
  certificateArn: arn:aws:acm:us-west-2:941377154785:certificate/00ccbf7f-38fb-4784-98cb-d121bad0a289
  # NO subnets annotation on purpose. reconstitute regenerates the public subnets every spin-up, so a
  # hardcoded list (as dev pins, because dev is long-lived) would go stale on the next rebuild. The
  # foundation tags the public subnets kubernetes.io/role/elb=1 + kubernetes.io/cluster/<cluster>=shared,
  # so the AWS Load Balancer Controller AUTO-DISCOVERS them -- nothing dynamic to commit.
