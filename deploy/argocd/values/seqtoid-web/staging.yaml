# staging overrides for the seqtoid-web chart. FRESH seqtoid pre-prod in account 030998640247, running
# ALONGSIDE the LIVE legacy czid-staging -- fully isolated (seqtoid-staging-* resources, own VPC 10.170/16,
# own terraform workspace). Mirrors sandbox.yaml. Edge: IRSA role seqtoid-web-staging (app terraform
# stack), the persistent env-staging.seqtoid.org ACM cert (in-account, ISSUED), subnets via LBC tag
# auto-discovery (no hardcoded IDs), host env-staging.seqtoid.org. Unlike sandbox, the env-staging.seqtoid.org
# zone IS in this account, so external-dns creates the record in-account (no manual ALIAS).
environment: staging
image:
  # Persistent seqtoid-web repo in the staging account (seqtoid-ssot-infra/infra/app-registry). Simple
  # repo name, like dev/sandbox.
  repository: 030998640247.dkr.ecr.us-west-2.amazonaws.com/seqtoid-web
  # PINNED. This env previously ran `tag: latest` + `pullPolicy: Always`, so ANY pod restart -- a
  # rollout, a node replacement, Karpenter expiry, a scale event, an incident recovery -- silently
  # moved it onto whatever was last pushed to :latest, with no gitops commit, no review and no record.
  # For the environment holding real alpha-tester P4 data that meant the declared state could not
  # express the running state, a behaviour change could not be correlated to a deploy, and rollback had
  # no previous tag to return to. It is also how the 2026-08-07 upload outage arrived: the pods rolled
  # forward onto an image needing an IAM permission the upload role did not have.
  #
  # digest wins over tag (chart helper `seqtoid-web.image`). The promotion pipeline (CZID-464,
  # promote-to-env.yml) advances BOTH on a tested promotion; do not hand-edit them out of step.
  tag: sha-74df9917
  digest: sha256:61c938e310513fad3158f1b888e67a35ba23fc0ed254bf38b5d14e373f94efd0
  # IfNotPresent, not Always: with an immutable digest there is nothing to re-pull, and Always would
  # reintroduce the drift this pin exists to remove.
  pullPolicy: IfNotPresent
# 2 replicas for HA (PDB maxUnavailable:1 + hard hostname topologySpread) -- see sandbox.yaml rationale.
replicaCount: 2
# Node scheduling (SMP-1636 #953). Staging has NO dedicated seqtoid.io/pool=web NodePool -- that is a
# DEV-ONLY Karpenter pool (terraform/envs/dev/eks-v2/nodepool-seqtoid-web.tf). Staging runs on a single
# managed nodegroup until it gets Karpenter (#958). So pin ONLY the chart's amd64 requirement here and do
# NOT add `seqtoid.io/pool: web`: adding it (e.g. by copying dev.yaml's nodeSelector under the "propagate
# dev up" doctrine) leaves the ENTIRE web tier Unschedulable (no node carries that label). Set explicitly
# (not left to the chart default) so the deliberate difference is visible and not "corrected" away. When
# staging gets its own web pool, add `seqtoid.io/pool: web` here to match dev.
nodeSelector:
  kubernetes.io/arch: amd64
migrate:
  # Fresh env: create the DB, migrate, then seed (app_configs incl. SFN ARNs from AWS_ACCOUNT_ID +
  # host_genomes + alignment_configs). All idempotent on re-runs.
  # seed:migrate applies pending SeedMigration migrations after db:seed (the generated db/seeds.rb
  # snapshot is stale against the catalog it ships). Without it, a FRESH bootstrap has app_config
  # *-version pins with no matching workflow_versions catalog row, and VersionRetrievalService
  # (CZID-982) fail-closes -> 500 on project create / project_pipeline_versions. Mirrors
  # bin/rebuild_system; idempotent (only unapplied migrations run). platform-overhaul #1115 / SMP-1715.
  command: ["rails", "db:create", "db:migrate:with_data", "db:seed", "seed:migrate"]
taxonLoad:
  # The chamber-seed points S3_DATABASE_BUCKET at the same-account seqtoid-public-references bucket; the
  # data layer's OpenSearch domain is up -- taxon-load imports the slice + builds the heatmap index.
  enabled: true
serviceAccount:
  # IRSA role naming is seqtoid-web-<env> (created by seqtoid-ssot-infra/infra/state-foundation/app),
  # NOT <env>-seqtoid-web.
  roleArn: arn:aws:iam::030998640247:role/seqtoid-web-staging

# Bulk-download launcher RBAC, rendered by the chart rather than click-opsed (SMP-1672).
#
# KubeJobClient POSTs batch/v1 Jobs as the web pod's SA, so that SA needs a namespace Role
# granting create on jobs.batch (plus read-only pods / pods/log). The chart comment says
# dev/staging/prod get this from Terraform -- that is true of DEV only
# (terraform/envs/dev/eks-v2/bulk-download-warmpool-rbac.tf). The fresh seqtoid-staging
# cluster in 030998640247 has no such stack: terraform/envs/staging is the LEGACY
# czid-staging tree and must not be repurposed for it. The Role/RoleBinding were applied by
# hand on 2026-08-04 to clear the bulk-download 403s, so they carry no Argo tracking and a
# reconstitute or a fresh env would silently lose them. Rendering them here puts them back
# under SSOT.
#
# The rendered pair is byte-equivalent to what is live: Role/RoleBinding "bulk-download-launcher"
# with the same three rules, bound to ServiceAccount czid-staging-seqtoid-web (this env sets
# only serviceAccount.roleArn, so the SA name is the chart fullname <project>-<env>-seqtoid-web).
# Enabling this therefore ADOPTS the existing objects; it does not create a second Role.
#
# Not covered here: the tar Job's own ServiceAccount seqtoid-web-bulk-download (IRSA ->
# seqtoid-web-staging-bulk-download-job) is outside chart scope and is still unmanaged.
bulkDownload:
  rbac:
    create: true
secrets:
  chamber:
    # FRESH seqtoid chamber path (not the chart default idseq-<env>-web = the LIVE legacy config). The
    # reconstitute chamber-seed-staging hook clones the legacy base in-account and repoints infra keys;
    # the app IRSA role is granted SSM read on exactly /seqtoid-staging-web/*.
    service: seqtoid-staging-web
extraEnv:
  # The main app (migrate/rollout/workers) reads CHAMBER_SERVICE from the image entrypoint (defaults to
  # idseq-<env>-web); set it explicitly to the fresh seqtoid path the IRSA role is scoped to.
  - name: CHAMBER_SERVICE
    value: seqtoid-staging-web
# Zero-downtime cutover: match dev's proven pingpong methodology (canary + ALB weighted
# target groups with static selectors, so pod readiness gates inject) instead of blueGreen,
# whose atomic activeService flip drops ALB traffic ~30s (503s) on every promotion. A PreSync
# smoke gate still validates the build at zero user traffic before the cutover. Requires on
# the staging cluster (terraform/envs/staging/eks): --aws-verify-target-group on the Argo
# Rollouts controller + its IRSA, and the elbv2.k8s.aws/pod-readiness-gate-inject namespace
# label (set on the seqtoid-web-staging Application's managedNamespaceMetadata). Roll back to
# blueGreen by removing this one key -- the blueGreen block below is the fallback.
rolloutStrategy: pingpong
blueGreen:
  autoPromotionEnabled: true # promote on smoke pass (the gate is proven on dev)
  scaleDownDelaySeconds: 60
  analysis:
    enabled: true
    postPromotion: true # also re-smoke the new active color
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 2Gi
autoscaling:
  enabled: false # pre-prod: no autoscale for the first spin-up
  minReplicas: 2
  maxReplicas: 4
# Public edge for staging. ALB via the AWS Load Balancer Controller -> active service.
# smoke_url matches env-reconstitute/config/envs.conf (https://env-staging.seqtoid.org).
ingress:
  enabled: true
  host: env-staging.seqtoid.org
  # Persistent ACM cert for env-staging.seqtoid.org (ISSUED, in-account DNS-validated). Lives OUTSIDE
  # reconstitute -- an account-level edge resource, stable across rebuilds, safe to pin.
  certificateArn: arn:aws:acm:us-west-2:030998640247:certificate/3ee144bd-901c-4b3b-9971-b52f51e0df2e
  # NO subnets annotation on purpose: the foundation tags the public subnets
  # kubernetes.io/role/elb=1 + kubernetes.io/cluster/<cluster>=shared, so the AWS Load Balancer
  # Controller AUTO-DISCOVERS them -- nothing goes stale when reconstitute regenerates subnets.
  #
  # WAF ATTACHED 2026-08-05 (was DEFERRED for the first spin-up). Until now this ingress had NO Web ACL --
  # verified live: get-web-acl-for-resource on the LBC ALB returned null, and env-staging.seqtoid.org is a
  # direct A record to that ALB (no CloudFront), so nothing was applying the export-control geo-block
  # either. Layer 3 (the app gate) has no AppConfig row and evaluates OFF, so before this change NOTHING
  # enforced export control at any layer.
  #
  # The ACL is `seqtoid-staging-web`, built by seqtoid-ssot-infra/infra/state-foundation/waf (the SSOT --
  # NOT the legacy idseq-staging-web-waf, which belongs to Jay's czid-staging and must not be touched).
  # It is deployed with count_only = true: the AWS-managed rule groups and the rate limit run in COUNT and
  # CANNOT block legitimate alpha-tester traffic, while the georestriction rule group BLOCKS the
  # counsel-owned jurisdiction set (CU, IR, KP, RU, SY, UA). Promote the managed rules to Block only after
  # reading their per-rule CloudWatch Count metrics -- see the waf stack header and FJ #1000.
  #
  # Pinned here rather than associated out of band: the LBC reconciles this ALB and would DROP an
  # out-of-band association, bringing the endpoint up OPEN (same note as prod-test.yaml).
  annotations:
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:us-west-2:030998640247:regional/webacl/seqtoid-staging-web/3065fa99-2135-4ac7-b2c1-51f3cd07f407
    # TLS policy is now a CHART default (seqtoid-web/deploy/charts/seqtoid-web/values.yaml ->
    # ingress.sslPolicy = ELBSecurityPolicy-TLS13-1-2-2021-06), so it is deliberately NOT repeated here.
    # It was set per-env briefly on 2026-08-05 before being moved to the chart, so every environment
    # inherits it and a future env cannot silently miss it. Override here only for a real exception.
