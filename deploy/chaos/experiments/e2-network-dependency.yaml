# E2 -- dependency impairment (platform-overhaul #794/#796). See ../DESIGN.md.
#
# Hypothesis: when a backing dependency (OpenSearch / Redis) is slow or unreachable,
# the web app degrades CLEANLY -- it does not 5xx-storm, hang every request, or take the
# whole page down. This directly probes the failure classes we already hit in the wild:
# the Redis Errno::EALREADY connect race (#790) and OpenSearch connect-timeouts on node
# rotation (taxon-indexing "N/0"). NetworkChaos lets us reproduce those on demand instead
# of waiting for a node to rotate at 3am.
#
# HOW: NetworkChaos `delay` + `partition` applied to the web pods' egress toward the
# dependency ENDPOINTS (externalTargets), so we impair the dependency WITHOUT touching
# the managed OpenSearch domain or ElastiCache. Fill in the real endpoints before use
# (see the TODO markers) -- left as placeholders so this cannot fire against the wrong host.
#
# SAFETY: Schedule -> Workflow with pre/in-flight StatusCheck (same pattern as E1). 60s
# fault, single direction, target namespace must be armed. NOT DEPLOYED.
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: e2-network-dependency
  namespace: chaos-mesh
spec:
  schedule: "0 7 * * *" # 07:00 UTC = 03:00 America/New_York; staggered after E1
  concurrencyPolicy: Forbid
  historyLimit: 5
  type: Workflow
  workflow:
    entry: e2
    templates:
      - name: e2
        templateType: Serial
        deadline: 12m
        children:
          - preflight-health
          - impair-and-watch
      - name: preflight-health
        templateType: StatusCheck
        deadline: 2m
        statusCheck:
          mode: Synchronous
          type: HTTP
          http:
            url: https://dev.seqtoid.org/health_check
            method: GET
            criteria:
              statusCode: "200"
      - name: impair-and-watch
        templateType: Parallel
        deadline: 6m
        children:
          - delay-to-dependency
          - steady-state-during
      # 500ms delay + 25% loss toward the dependency endpoint for 60s. Swap `delay` for a
      # full `partition` (action: partition, direction: to) to test hard-down instead of slow.
      - name: delay-to-dependency
        templateType: NetworkChaos
        networkChaos:
          action: delay
          mode: all
          duration: 60s
          direction: to
          selector:
            namespaces:
              - seqtoid-dev
            labelSelectors:
              app.kubernetes.io/component: web
          delay:
            latency: "500ms"
            correlation: "50"
            jitter: "100ms"
          loss:
            loss: "25"
            correlation: "50"
          # TODO before use: set the real dependency endpoint(s). Impairs ONLY traffic to
          # these hosts, nothing else. e.g. the OpenSearch domain endpoint, or the
          # ElastiCache/Redis primary endpoint. Placeholder so this cannot mis-fire.
          externalTargets:
            - "REPLACE-with-opensearch-or-redis-endpoint.dev.internal"
      - name: steady-state-during
        templateType: StatusCheck
        deadline: 5m
        statusCheck:
          mode: Continuous
          type: HTTP
          duration: 2m
          intervalSeconds: 2
          # More tolerant than E1: some slow responses are EXPECTED while the dependency
          # is impaired. We are asserting "no hard-down / no 5xx storm", not "no latency".
          failureThreshold: 10
          recordsHistoryLimit: 100
          http:
            url: https://dev.seqtoid.org/health_check
            method: GET
            criteria:
              statusCode: "200"
