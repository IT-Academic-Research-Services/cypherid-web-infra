# P1 -- Batch job-kill mid-alignment (platform-overhaul #794/#808). Instantiates ../../templates/dual-gate.yaml.
#
# Hypothesis: terminating ONE Batch job while it is aligning does NOT corrupt the run -- the Step
# Functions Retry re-runs the job and the pipeline still produces AUPR >= 0.98. This proves the
# designed Batch-attempt / SFN-Retry fallback (dependency-register: aws-batch, step-functions) is
# actually wired, not just assumed.
#
# TARGET: the disposable dev-chaos sandbox ONLY. The inject container sources the fail-closed
# sandbox guard (_sandbox-guard.yaml): it refuses to terminate any job whose queue is not
# idseq-dev-chaos-* AND tagged seqtoid.io/chaos-sandbox=true. The shared idseq-dev-* pipeline can
# never be selected.
#
# DUAL GATE: passes only if BOTH hold under the fault --
#   availability = SLO probe /steady-state stays 200 (pipeline SLOs: job-success-rate, queue-depth),
#   accuracy     = a benchmark run on the sandbox SFN completes at AUPR >= 0.98 + checksum integrity.
#
# NOT DEPLOYED. Apply only after: sandbox stood up (README build order), recovery proven
# (destroy/apply + one clean AUPR >= 0.98), Chaos Mesh + SLO probe + accuracy probe up.
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: dual-gate-p1-batch-job-kill
  namespace: chaos-mesh
spec:
  entry: dual-gate
  templates:
    - name: dual-gate
      templateType: Serial
      deadline: 45m # accuracy gate = a full sandbox benchmark run; give it room
      children:
        - preflight-both-gates
        - inject-and-assert
        - verdict

    # 1) Do not inject unless BOTH gates are green: availability (SLO probe) AND accuracy
    #    (a fresh sandbox baseline is within spec). Abort before any fault otherwise.
    - name: preflight-both-gates
      templateType: StatusCheck
      deadline: 3m
      statusCheck:
        mode: Synchronous
        type: HTTP
        http:
          url: http://chaos-slo-probe.chaos-mesh.svc.cluster.local/steady-state
          method: GET
          criteria:
            statusCode: "200"

    # 2) Inject while BOTH gates watch in parallel. Any child failing aborts the node ->
    #    fault removed early -> experiment fails closed.
    - name: inject-and-assert
      templateType: Parallel
      deadline: 40m
      children:
        - guard-then-kill-batch-job
        - availability-gate
        - accuracy-gate

    # ---- FAULT: guard first (fail closed), then terminate one running sandbox alignment job. ----
    - name: guard-then-kill-batch-job
      templateType: Task
      task:
        container:
          name: inject
          image: chaos-pipeline-inject:latest # aws-cli + bash; mounts the sandbox guard ConfigMap
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              source /guard/guard.sh
              # Find one RUNNING alignment job on the sandbox queue. TODO: pin the exact sandbox
              # alignment queue name once the sandbox is applied -- it is deterministic:
              #   idseq-dev-chaos-<alignment-queue-suffix> (mirror of the dev alignment queue name).
              QUEUE="idseq-dev-chaos-REPLACE-alignment-queue"
              JOB_ID="$(aws batch list-jobs --job-queue "$QUEUE" --job-status RUNNING \
                          --query 'jobSummaryList[0].jobId' --output text)"
              if [[ -z "$JOB_ID" || "$JOB_ID" == "None" ]]; then
                echo "no running alignment job on $QUEUE; nothing to kill (start a benchmark run first)" >&2
                exit 1
              fi
              JOB_ARN="$(aws batch describe-jobs --jobs "$JOB_ID" \
                           --query 'jobs[0].jobArn' --output text)"
              # Fail-closed guard: refuse unless this is a dev-chaos, tagged resource.
              assert_sandbox_target "$JOB_ARN"
              # Transient fault only: terminate the EXECUTION, never the job definition / queue.
              aws batch terminate-job --job-id "$JOB_ID" \
                --reason "chaos-engine P1 job-kill (sandbox, expect SFN Retry to re-run)"
              echo "terminated $JOB_ID on $QUEUE; SFN Retry should re-run it" >&2
          volumeMounts:
            - name: guard
              mountPath: /guard
        volumes:
          - name: guard
            configMap:
              name: chaos-sandbox-guard
              defaultMode: 0555

    # ---- AVAILABILITY gate (identical across P-series): pipeline SLOs via the SLO probe. ----
    - name: availability-gate
      templateType: StatusCheck
      deadline: 38m
      statusCheck:
        mode: Continuous
        type: HTTP
        duration: 36m
        intervalSeconds: 10
        failureThreshold: 3
        recordsHistoryLimit: 200
        http:
          # Pipeline steady-state: extend the SLO probe assertion set with job-success-rate +
          # queue-depth for the sandbox (DESIGN.md section 10). Same URL, richer assertions.
          url: http://chaos-slo-probe.chaos-mesh.svc.cluster.local/steady-state?scope=pipeline-dev-chaos
          method: GET
          criteria:
            statusCode: "200"

    # ---- ACCURACY gate (identical across P-series): benchmark on the SANDBOX SFN, assert
    #      AUPR >= 0.98 + checksum integrity. The probe's BENCHMARK_TRIGGER_URL points at the
    #      idseq-dev-chaos SFN, NEVER shared dev (see ../../templates/dual-gate.yaml ConfigMap). ----
    - name: accuracy-gate
      templateType: StatusCheck
      deadline: 40m
      statusCheck:
        mode: Synchronous
        type: HTTP
        timeoutSeconds: 2100
        http:
          url: http://chaos-accuracy-probe.chaos-mesh.svc.cluster.local/run-under-fault?scope=dev-chaos
          method: GET
          criteria:
            statusCode: "200"

    # 3) Record the verdict either way (Grafana annotation always; Forgejo ticket on fail).
    - name: verdict
      templateType: Task
      task:
        container:
          name: verdict
          image: chaos-report:latest
          command: ["/report", "--experiment", "dual-gate-p1-batch-job-kill"]
