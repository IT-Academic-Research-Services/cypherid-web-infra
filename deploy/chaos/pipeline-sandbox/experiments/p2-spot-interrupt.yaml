# P2 -- spot interruption during a task (platform-overhaul #794/#808). Instantiates ../../templates/dual-gate.yaml.
#
# Hypothesis: a Spot interruption of a sandbox Batch instance mid-task is tolerated -- the pipeline
# already must survive Spot reclamation, so the job retries on a fresh instance and AUPR still holds.
# This proves the tolerance the pipeline is ASSUMED to have (dependency-register: aws-batch,
# safe_to_fail: true) is real.
#
# FAULT: AWS FIS action aws:ec2:send-spot-instance-interruptions, scoped by the FIS experiment
# template to instances tagged seqtoid.io/chaos-sandbox=true (see ../fis/fis-experiment-templates.tf).
# The inject container additionally guards on the template name (fail closed) before starting it.
#
# NOT DEPLOYED. Apply after sandbox stand-up + recovery proof; the FIS template must be applied first.
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: dual-gate-p2-spot-interrupt
  namespace: chaos-mesh
spec:
  entry: dual-gate
  templates:
    - name: dual-gate
      templateType: Serial
      deadline: 45m
      children:
        - preflight-both-gates
        - inject-and-assert
        - verdict

    - name: preflight-both-gates
      templateType: StatusCheck
      deadline: 3m
      statusCheck:
        mode: Synchronous
        type: HTTP
        http:
          url: http://chaos-slo-probe.chaos-mesh.svc.cluster.local/steady-state
          method: GET
          criteria:
            statusCode: "200"

    - name: inject-and-assert
      templateType: Parallel
      deadline: 40m
      children:
        - guard-then-start-fis
        - availability-gate
        - accuracy-gate

    # ---- FAULT: guard on the template name, then start the tag-scoped FIS spot-interrupt template. ----
    - name: guard-then-start-fis
      templateType: Task
      task:
        container:
          name: inject
          image: chaos-pipeline-inject:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              source /guard/guard.sh
              # Resolve the sandbox FIS template by its Name tag (authored in ../fis/). The template's
              # own target filter is seqtoid.io/chaos-sandbox=true, so FIS can only touch the sandbox.
              TPL_NAME="idseq-dev-chaos-fis-p2-spot-interrupt"
              assert_sandbox_fis_template "$TPL_NAME"
              TPL_ID="$(aws fis list-experiment-templates \
                          --query "experimentTemplates[?tags.Name=='${TPL_NAME}'].id | [0]" \
                          --output text)"
              if [[ -z "$TPL_ID" || "$TPL_ID" == "None" ]]; then
                echo "FIS template $TPL_NAME not found -- apply ../fis/fis-experiment-templates.tf first" >&2
                exit 1
              fi
              aws fis start-experiment --experiment-template-id "$TPL_ID" \
                --tags "seqtoid.io/chaos-sandbox=true,seqtoid.io/chaos-experiment=p2"
              echo "started FIS spot-interrupt $TPL_ID against sandbox instances" >&2
          volumeMounts:
            - name: guard
              mountPath: /guard
        volumes:
          - name: guard
            configMap:
              name: chaos-sandbox-guard
              defaultMode: 0555

    - name: availability-gate
      templateType: StatusCheck
      deadline: 38m
      statusCheck:
        mode: Continuous
        type: HTTP
        duration: 36m
        intervalSeconds: 10
        failureThreshold: 3
        recordsHistoryLimit: 200
        http:
          url: http://chaos-slo-probe.chaos-mesh.svc.cluster.local/steady-state?scope=pipeline-dev-chaos
          method: GET
          criteria:
            statusCode: "200"

    - name: accuracy-gate
      templateType: StatusCheck
      deadline: 40m
      statusCheck:
        mode: Synchronous
        type: HTTP
        timeoutSeconds: 2100
        http:
          url: http://chaos-accuracy-probe.chaos-mesh.svc.cluster.local/run-under-fault?scope=dev-chaos
          method: GET
          criteria:
            statusCode: "200"

    - name: verdict
      templateType: Task
      task:
        container:
          name: verdict
          image: chaos-report:latest
          command: ["/report", "--experiment", "dual-gate-p2-spot-interrupt"]
