# Chaos Engine pipeline sandbox -- the fail-closed target guard (platform-overhaul #794/#808).
#
# THE structural reason a pipeline chaos fault can only ever hit the disposable dev-chaos copy and
# never the shared dev pipeline. Every P-series inject node sources assert_sandbox_target() from this
# ConfigMap and calls it FIRST; the actual fault runs only if the guard passes. Any target that is not
# both (a) named idseq-dev-chaos-* AND (b) tagged seqtoid.io/chaos-sandbox=true makes the guard exit
# non-zero, which aborts the Workflow's parallel node -> the fault is never injected (fail closed).
# This mirrors the managed_name? guard in the taxon-lineage rollback: refuse to act on anything that
# is not the sandbox object by construction, not by convention.
#
# The seqtoid.io/chaos-sandbox=true tag is applied to every dev-chaos resource by the conditional
# default_tags local in cypherid-workflow-infra/main.tf (only when DEPLOYMENT_ENVIRONMENT=dev-chaos),
# so it exists on the sandbox and on nothing else.
#
# NOT DEPLOYED. Applied with the P-series only after the sandbox is stood up and armed (see README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: chaos-sandbox-guard
  namespace: chaos-mesh
data:
  # Sourced by every inject container. Usage: assert_sandbox_target <resource-arn-or-name>
  # Exits 0 only if the target is the dev-chaos sandbox; exits 3 (fail closed) otherwise.
  guard.sh: |
    #!/usr/bin/env bash
    # ASCII only. Fail closed on any error, unset var, or pipe failure.
    set -euo pipefail

    # The one allowed environment. Nothing here is parameterised to another env on purpose:
    # a typo or an injected value cannot redirect the fault at the shared dev pipeline.
    readonly CHAOS_ENV="dev-chaos"
    readonly CHAOS_NAME_PREFIX="idseq-dev-chaos-"
    readonly CHAOS_TAG_KEY="seqtoid.io/chaos-sandbox"
    readonly CHAOS_TAG_VALUE="true"

    assert_sandbox_target() {
      local target="${1:-}"
      if [[ -z "$target" ]]; then
        echo "GUARD: refusing -- no target given" >&2
        exit 3
      fi

      # (a) Name guard: the target ARN or name must carry the sandbox prefix. A shared
      #     dev resource (idseq-dev-*) does not contain idseq-dev-chaos- and is refused.
      if [[ "$target" != *"${CHAOS_NAME_PREFIX}"* ]]; then
        echo "GUARD: refusing -- '$target' is not an ${CHAOS_NAME_PREFIX}* resource" >&2
        exit 3
      fi

      # (b) Tag guard: the target must actually carry seqtoid.io/chaos-sandbox=true. This
      #     is the authoritative check -- a name alone could be spoofed; the tag is applied
      #     only by a dev-chaos terraform apply. Read-only call; no mutation.
      local got
      got="$(aws resourcegroupstaggingapi get-resources \
               --resource-arn-list "$target" \
               --query "ResourceTagMappingList[0].Tags[?Key=='${CHAOS_TAG_KEY}'].Value | [0]" \
               --output text 2>/dev/null || echo "MISSING")"
      if [[ "$got" != "$CHAOS_TAG_VALUE" ]]; then
        echo "GUARD: refusing -- '$target' lacks ${CHAOS_TAG_KEY}=${CHAOS_TAG_VALUE} (got '$got')" >&2
        exit 3
      fi

      echo "GUARD: ok -- '$target' is the ${CHAOS_ENV} sandbox; fault permitted" >&2
    }

    # For faults expressed as an AWS FIS experiment template (P2/P4/P5/P6): the template's
    # own targets are tag-scoped to ${CHAOS_TAG_KEY}=${CHAOS_TAG_VALUE} (see ../fis/), so FIS
    # itself will only touch the sandbox. This helper additionally refuses to START a template
    # whose name is not the sandbox template, so a wrong template id cannot be launched.
    assert_sandbox_fis_template() {
      local tpl_name="${1:-}"
      if [[ "$tpl_name" != *"${CHAOS_NAME_PREFIX}"* ]]; then
        echo "GUARD: refusing -- FIS template '$tpl_name' is not an ${CHAOS_NAME_PREFIX}* template" >&2
        exit 3
      fi
      echo "GUARD: ok -- FIS template '$tpl_name' is a sandbox template" >&2
    }
