# Support Inbox (Option A, Forgejo #828/#440): the app's structured [support_request] log lines
# (SupportRequestsController#create) as a Grafana queue on Loki. Sidecar-provisioned; hot-reloads.
# Apply: kubectl apply -f deploy/observability/grafana-dashboard-support-inbox.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-support-inbox
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  support-inbox.json: |
    {
      "uid": "seqtoid-support-inbox",
      "title": "seqtoid - Support Inbox",
      "tags": [
        "seqtoid",
        "support",
        "loki"
      ],
      "schemaVersion": 39,
      "version": 3,
      "refresh": "1m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "timepicker": {},
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "custom",
            "label": "Namespace",
            "query": "seqtoid-dev",
            "current": {
              "text": "seqtoid-dev",
              "value": "seqtoid-dev"
            },
            "options": [
              {
                "text": "seqtoid-dev",
                "value": "seqtoid-dev",
                "selected": true
              }
            ]
          },
          {
            "name": "ticket",
            "type": "textbox",
            "label": "Selected ticket",
            "query": ".*",
            "current": {
              "text": ".*",
              "value": ".*"
            },
            "description": "Set when you click a row. Reset to .* to show all tickets."
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Tickets (range)",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({namespace=\"$namespace\"} |= \"[support_request]\" [$__range]))",
              "editorMode": "code",
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Tickets (24h)",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "purple"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({namespace=\"$namespace\"} |= \"[support_request]\" [24h]))",
              "editorMode": "code",
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Tickets (7d)",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({namespace=\"$namespace\"} |= \"[support_request]\" [7d]))",
              "editorMode": "code",
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 4,
          "type": "table",
          "title": "Support queue  -  click a row to load it in Ticket detail below",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{namespace=\"$namespace\"} |= \"[support_request]\" | regexp \"(?P<payload>\\\\{.*\\\\})\" | line_format \"{{ .payload }}\" | json submitted=\"submitted_at\", email=\"user_email\", role=\"user_role\", error=\"error\", task=\"task\", project=\"project\", account=\"account_name\", description=\"description\", summary=\"summary\", trace_id=\"correlation_id\", runbook_label=\"runbook.label\", runbook_url=\"runbook.runbook\", environment=\"environment\"",
              "editorMode": "code",
              "queryType": "range"
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "sortBy": [
              {
                "displayName": "submitted",
                "desc": true
              }
            ]
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "filterable": true,
                "cellOptions": {
                  "type": "auto",
                  "wrapText": true
                }
              },
              "links": [
                {
                  "title": "Show this ticket in the detail panel below",
                  "url": "/d/seqtoid-support-inbox/seqtoid-support-inbox?var-ticket=${__data.fields.trace_id}&${__url_time_range}",
                  "targetBlank": false
                }
              ]
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "submitted"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 150
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "email"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 195
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "error"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 115
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "task"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 135
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "description"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 300
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "runbook"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 150
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "trace id"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 250
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "runbook"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open runbook",
                        "url": "${__data.fields.runbook_url}",
                        "targetBlank": true
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "extractFields",
              "options": {
                "source": "labels",
                "keepLabels": [
                  "submitted",
                  "email",
                  "role",
                  "error",
                  "task",
                  "project",
                  "account",
                  "description",
                  "summary",
                  "trace_id",
                  "runbook_label",
                  "runbook_url",
                  "environment"
                ]
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "tsNs": true,
                  "id": true,
                  "labels": true,
                  "Line": true,
                  "labelTypes": true,
                  "__error__": true,
                  "__error_details__": true,
                  "runbook_url": true,
                  "role": true,
                  "project": true,
                  "account": true,
                  "summary": true,
                  "environment": true
                },
                "indexByName": {
                  "submitted": 0,
                  "email": 1,
                  "error": 2,
                  "task": 3,
                  "description": 4,
                  "runbook_label": 5,
                  "trace_id": 6
                },
                "renameByName": {
                  "trace_id": "trace id",
                  "runbook_label": "runbook"
                }
              }
            }
          ]
        },
        {
          "id": 5,
          "type": "logs",
          "title": "Ticket detail  -  clean view of the selected ticket   (showing: $ticket)",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 15,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "options": {
            "showTime": false,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{namespace=\"$namespace\"} |= \"[support_request]\" |~ \"$ticket\" | regexp \"(?P<payload>\\\\{.*\\\\})\" | line_format \"{{ .payload }}\"",
              "editorMode": "code",
              "queryType": "range"
            }
          ]
        },
        {
          "id": 6,
          "type": "text",
          "title": "",
          "transparent": true,
          "gridPos": {
            "h": 3,
            "w": 24,
            "x": 0,
            "y": 28
          },
          "options": {
            "mode": "markdown",
            "content": "**Click a row** in the queue to load that ticket below, then **expand the line** to see every field (summary, journey, diagnostics) and click the runbook / CloudWatch / OTel links. Reset the **Selected ticket** variable to `.*` to show all.  \\n*History is limited to Loki's 7-day retention. Deep-links resolve once `OTEL_DASHBOARD_BASE_URL` + `SUPPORT_LOG_GROUP` are set (#472).*"
          }
        }
      ],
      "annotations": {
        "list": []
      },
      "editable": true
    }
